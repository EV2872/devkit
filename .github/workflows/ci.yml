name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: devkit-fedora-env

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dev image
        run: docker compose -f docker/docker-compose.yml build dev-env
      - name: Save image
        run: docker save ${{ env.IMAGE_NAME }} -o /tmp/devkit-image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: devkit-image
          path: /tmp/devkit-image.tar
          retention-days: 1

  format-check:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: devkit-image, path: /tmp }
      - run: docker load -i /tmp/devkit-image.tar
      - name: Check formatting
        run: |
          docker run --rm --user root -v ${{ github.workspace }}:/home/dev/project \
            ${{ env.IMAGE_NAME }} bash -c '
              find inc src app test -name "*.hpp" -o -name "*.cpp" | \
              xargs clang-format --dry-run --Werror
            '

  build-and-test-debug:
    needs: build-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      # 1. EL CACHÉ VA ANTES DE COMPILAR
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.compiler }}-

      - uses: actions/download-artifact@v4
        with: { name: devkit-image, path: /tmp }
      - run: docker load -i /tmp/devkit-image.tar

      # 2. MONTAMOS EL VOLUMEN DE CONAN (-v ~/.conan2:/root/.conan2)
      - name: Configure, build and test (${{ matrix.compiler }})
        run: |
          docker run --rm --user root \
            -v ${{ github.workspace }}:/home/dev/project \
            -v ~/.conan2:/root/.conan2 \
            ${{ env.IMAGE_NAME }} bash -c '
              ./scripts/configure.sh debug ${{ matrix.compiler }} &&
              cmake --build --preset debug &&
              ctest --preset debug --output-on-failure
            '

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-debug-${{ matrix.compiler }}
          path: temp/build/debug/Testing/
          retention-days: 7

  cppcheck:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-gcc-${{ hashFiles('conanfile.py') }}

      - uses: actions/download-artifact@v4
        with: { name: devkit-image, path: /tmp }
      - run: docker load -i /tmp/devkit-image.tar

      - name: Configure and run cppcheck
        run: |
          docker run --rm --user root \
            -v ${{ github.workspace }}:/home/dev/project \
            -v ~/.conan2:/root/.conan2 \
            ${{ env.IMAGE_NAME }} bash -c '
              ./scripts/configure.sh debug &&
              cmake --build temp/build/debug --target cppcheck
            '

  build-and-test-release:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-gcc-release-${{ hashFiles('conanfile.py') }}

      - uses: actions/download-artifact@v4
        with: { name: devkit-image, path: /tmp }
      - run: docker load -i /tmp/devkit-image.tar

      - name: Configure, build and test
        run: |
          docker run --rm --user root \
            -v ${{ github.workspace }}:/home/dev/project \
            -v ~/.conan2:/root/.conan2 \
            ${{ env.IMAGE_NAME }} bash -c '
              ./scripts/configure.sh release &&
              cmake --build --preset release &&
              ctest --build-config Release --test-dir temp/build/release --output-on-failure
            '

  coverage:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-gcc-cov-${{ hashFiles('conanfile.py') }}

      - uses: actions/download-artifact@v4
        with: { name: devkit-image, path: /tmp }
      - run: docker load -i /tmp/devkit-image.tar

      - name: Configure, build, test and generate coverage
        run: |
          docker run --rm --user root \
            -v ${{ github.workspace }}:/home/dev/project \
            -v ~/.conan2:/root/.conan2 \
            ${{ env.IMAGE_NAME }} bash -c '
              ./scripts/configure.sh coverage &&
              cmake --build temp/build/coverage &&
              ctest --test-dir temp/build/coverage --output-on-failure &&
              cmake --build temp/build/coverage --target coverage
            '

  valgrind:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-gcc-val-${{ hashFiles('conanfile.py') }}

      - uses: actions/download-artifact@v4
        with: { name: devkit-image, path: /tmp }
      - run: docker load -i /tmp/devkit-image.tar

      - name: Configure, build and run memcheck
        run: |
          docker run --rm --user root \
            -v ${{ github.workspace }}:/home/dev/project \
            -v ~/.conan2:/root/.conan2 \
            ${{ env.IMAGE_NAME }} bash -c '
              ./scripts/configure.sh valgrind &&
              cmake --build temp/build/valgrind &&
              cmake --build temp/build/valgrind --target memcheck
            '

  docs:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-gcc-docs-${{ hashFiles('conanfile.py') }}

      - uses: actions/download-artifact@v4
        with: { name: devkit-image, path: /tmp }
      - run: docker load -i /tmp/devkit-image.tar

      - name: Generate documentation
        run: |
          docker run --rm --user root \
            -v ${{ github.workspace }}:/home/dev/project \
            -v ~/.conan2:/root/.conan2 \
            ${{ env.IMAGE_NAME }} bash -c '
              ./scripts/configure.sh debug &&
              cmake --preset debug -DDEVKIT_BUILD_DOCS=ON &&
              cmake --build temp/build/debug --target docs
            '

  conan-package:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-package-${{ hashFiles('conanfile.py') }}

      - uses: actions/download-artifact@v4
        with: { name: devkit-image, path: /tmp }
      - run: docker load -i /tmp/devkit-image.tar

      - name: conan create
        run: |
          docker run --rm --user root \
            -v ${{ github.workspace }}:/home/dev/project \
            -v ~/.conan2:/root/.conan2 \
            ${{ env.IMAGE_NAME }} bash -c '
              conan create . --build=missing
            '

  ci-success:
    if: always()
    needs: [format-check, build-and-test-debug, cppcheck, build-and-test-release, coverage, valgrind, docs, conan-package]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            exit 1
          fi